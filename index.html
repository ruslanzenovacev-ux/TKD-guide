@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#060807;--card:#0f1411;--ink:#eef4f0;--mut:#9db0a4;--acc:#2ee07a;--accw:#04120a;--far:#6b7077;--body:#e6e6e6;--line:#1e2b23;--ground:#444;--good:#2ee07a;--goodbg:#10301c;--badbg:#3a1a20;--nav:#000;--sh:none}}
:root[data-theme="dark"]{--bg:#060807;--card:#0f1411;--ink:#eef4f0;--mut:#9db0a4;--acc:#2ee07a;--accw:#04120a;--far:#6b7077;--body:#e6e6e6;--line:#1e2b23;--ground:#444;--good:#2ee07a;--goodbg:#10301c;--badbg:#3a1a20;--nav:#000;--sh:none}
.lg{display:block;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.lg.mark{-webkit-mask-image:var(--mark);mask-image:var(--mark)}.lg.emb{-webkit-mask-image:var(--emb);mask-image:var(--emb)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:var(--nav);color:#fff;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:3px solid var(--acc)}.top .lg{width:38px;height:28px;flex:none;color:#fff}
.top h1{font-size:20px;margin:0;line-height:1.25;font-weight:700;letter-spacing:.01em}
.back{font-size:30px;line-height:1;text-decoration:none;color:#fff;padding:0 10px 4px 0;margin-left:-6px;min-width:34px}
main{padding:16px}
h2{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:26px 0 10px}
h3{margin:0}
p{margin:0 0 10px}
a{color:var(--acc)}
.lead{color:var(--mut)}.warn{background:var(--badbg);padding:8px 12px;border-radius:10px;color:var(--ink)}
.small{font-size:14px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:0 0 12px;color:inherit;text-decoration:none;display:block;box-shadow:var(--sh)}
.card.belt,.card.sec,.card.row,.hero{display:flex;align-items:center;gap:12px}
.card.row{justify-content:space-between}.card.row span,.card.belt span,.card.sec span{color:var(--mut);font-size:15px}.card.belt b,.card.sec b{font-size:18px}

const CLUB_CODE_HASH = "bf2oqj93co";
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem("tkd:" + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("tkd:" + k, JSON.stringify(v)); } catch (e) {} }
};
function hash(s) { // cyrb53
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const beltOf = id => DATA.belts.find(b => b.id === id);
const ALL_SECTIONS = ["req","theory","stances","kicks","hands","judging"];
const pl = (n, f) => { const m = n % 10, h = n % 100; return n + " " + (m === 1 && h !== 11 ? f[0] : m >= 2 && m <= 4 && (h < 12 || h > 14) ? f[1] : f[2]); };

function doneBox(b, s) {

function bindDone(b, s) { const c = $("#dn"); if (c) c.onchange = () => setDone(b, s, c.checked); }

function section(id, s) {
  const b = beltOf(id); if (!b) return home();
  const back = "#/belt/" + id;
  if (s === "req") {
    layout(b.title + " · Требования", `
      <h2>Туль</h2><div class="card"><b>${esc(b.tul.name)}</b> — ${b.tul.moves} движений</div>
      <h2>ОФП (кондиция)</h2><div class="card">${b.ofp.map(r => `<p class="kv"><span>${esc(r[0])}</span><b>${esc(r[1])}</b></p>`).join("")}</div>
      ${b.extra.length ? `<h2>Также нужно</h2><div class="card">${b.extra.map(t => `<p>• ${esc(t)}</p>`).join("")}</div>` : ""}
      ${b.massogi.length ? `<h2>Массоги</h2><div class="card">${b.massogi.map(t => `<p>• ${esc(t)}</p>`).join("")}</div>` : ""}
      ${doneBox(id, s)}`, {back, tab:"learn"});
    bindDone(id, s);
  } else if (s === "theory") {
    const T = (arr) => arr.map(t => `<p class="kv"><b>${esc(t[0])}</b><span>${esc(t[1])}</span></p>`).join("");
    const flags = (b.termsFlag || []).map(t => `<p class="kv"><b>${esc(t[0])}</b><span>${esc(t[1].split(" (")[0])}</span></p>`).join("");
    layout(b.title + " · Теория", `
      <h2>Вопросы экзаменатора</h2>
      <a class="btn wide alt" href="#/cards/${id}">Карточки: проверить себя</a>
      <div class="card">${b.qa.map((q, i) => `<details><summary>${esc(q[0])}</summary><p>${esc(q[1])}</p></details>`).join("")}</div>
      <h2>Команды</h2><div class="card">${T(b.commands)}</div>
      ${b.count ? `<h2>Счёт от 1 до 10</h2><div class="card">${T(b.count)}</div>` : ""}
      <h2>Термины</h2><div class="card">${T(b.terms)}${flags}</div>
      ${doneBox(id, s)}`, {back, tab:"learn"});
    bindDone(id, s);
  } else if (s === "stances" || s === "kicks" || s === "hands") {
    const ids = b[s];
    layout(b.title + " · " + SEC_NAME[s], `<div id="figs"></div>${ids.length ? "" : '<div class="card"><p>На этом поясе новых элементов в этом разделе нет.</p></div>'}${doneBox(id, s)}`, {back, tab:"learn"});
    ids.forEach(fid => $("#figs").appendChild(figCard(fid, b)));
    bindDone(id, s);
  } else if (s === "judging" && b.judging && b.judging.length) {
    layout(b.title + " · Судейство", b.judging.map(g => `<h2>${esc(g.title)}</h2>` + g.blocks.map(k => `<div class="card jl"><h3>${esc(k.h)}</h3><ul>${k.li.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`).join("")).join("") + doneBox(id, s), {back, tab:"learn"});
    bindDone(id, s);
  } else beltPage(id);
}

  if (!editOn()) { location.hash = "#/editor"; return; }
  const op = editOpen[id] = editOpen[id] || {};
  layout("Правка · " + b.title, `<p class="small">Правки сохраняются на этом устройстве сразу. Чтобы они появились у учеников, выгрузите файл на странице редактора.</p>
    <div class="card ed">${EDITOR.filter(f => !(f.opt && !b[f.k])).map(f => `<details data-k="${f.k}" ${op[f.k] ? "open" : ""}><summary>${f.t}</summary>${fieldHtml(b, f)}</details>`).join("")}</div>`, {back:"#/editor", tab:"more"});
}
function editorPage() {
  if (!editOn()) {
    layout("Режим редактора", `<p class="lead">Введите код инструктора.</p><form id="ef"><input id="ecode" type="password" autocomplete="off" autocapitalize="off" placeholder="Код инструктора"><button class="btn wide" type="submit">Войти</button><p class="err" id="eerr"></p></form>`, {back:"#/more", tab:"more"});
    $("#ef").onsubmit = e => { e.preventDefault(); if (hash($("#ecode").value.trim().toLowerCase()) === EDIT_HASH) { LS.set("editor", true); editorPage(); } else $("#eerr").textContent = "Неверный код"; };
    return;
  }
  const n = Object.keys(LS.get("draft", {})).length;
  layout("Режим редактора", `<p class="lead">Выберите пояс и правьте вопросы, термины, ОФП, судейство. Фото и видео меняются файлами в папке приложения.</p>
    ${DATA.belts.map(b => `<a class="card belt" href="#/edit/${b.id}">${beltSwatch(b)}<div class="grow"><b>${esc(b.title)}</b><span>${esc(b.name)}</span></div><small>править</small></a>`).join("")}
    <h2>Показать ученикам</h2>
    <div class="card"><p class="small">${n ? "Есть правки на этом устройстве: поясов " + n + "." : "Правок на этом устройстве пока нет."} 1) Нажмите «Скачать content.json». 2) Положите файл в папку приложения рядом с index.html (замените старый). 3) Ученики увидят правки при следующем запуске. 4) На этом устройстве после замены файла нажмите «Сбросить правки».</p>
    <button class="btn wide" id="exp">Скачать content.json</button><button class="btn wide alt" id="cp">Скопировать текст файла</button><button class="btn wide alt" id="rs">Сбросить правки на этом устройстве</button><button class="btn wide alt" id="eo">Выйти из режима редактора</button></div>`, {back:"#/more", tab:"more"});
  $("#exp").onclick = () => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([exportData()], {type:"application/json"})); a.download = "content.json"; document.body.appendChild(a); a.click(); a.remove(); };
  $("#cp").onclick = () => { navigator.clipboard && navigator.clipboard.writeText(exportData()).then(() => alert("Скопировано"), () => alert("Не удалось скопировать")); };
  $("#rs").onclick = () => { if (confirm("Удалить правки, сделанные на этом устройстве?")) { LS.set("draft", {}); location.reload(); } };
  $("#eo").onclick = () => { LS.set("editor", false); route(); };
}
(function editorEvents() {
  const cur = () => (location.hash || "").split("/")[2];
  const rerender = () => { const id = cur(), op = editOpen[id] = {}; document.querySelectorAll("details[data-k]").forEach(d => { op[d.dataset.k] = d.open; }); editPage(id); };
  document.addEventListener("input", e => {
    const t = e.target; if (!t.closest || !t.closest(".ed") || t.dataset.k == null) return;
    const id = cur(), b = beltOf(id), k = t.dataset.k, f = EDITOR.find(x => x.k === k), v = t.value;
    if (t.dataset.g != null) { const g = b.judging[+t.dataset.g]; if (t.dataset.b == null) g.title = v; else { const bl = g.blocks[+t.dataset.b]; if (t.dataset.f === "h") bl.h = v; else bl.li = v.split("\n").map(s => s.trim()).filter(Boolean); } }
    else if (f.text) b[k] = v;
    else if (f.list) b[k][+t.dataset.i] = v;
    else { const r = b[k][+t.dataset.i], c = +t.dataset.c; if (f.facts && c >= 2) r[2][c - 2] = v; else r[c] = v; }
    saveDraft(id, k);
  });
  document.addEventListener("click", e => {
    const t = e.target.closest && e.target.closest("[data-act]"); if (!t || !t.closest(".ed")) return;
    const id = cur(), b = beltOf(id), k = t.dataset.k, f = EDITOR.find(x => x.k === k), act = t.dataset.act;
    if (act === "add") b[k].push(f.list ? "" : f.facts ? ["", "", ["", "", ""]] : ["", ""]);
    else if (act === "del") { if (!confirm("Удалить эту строку?")) return; b[k].splice(+t.dataset.i, 1); }
    else if (act === "addb") b.judging[+t.dataset.g].blocks.push({h:"Новый блок", li:[]});
    else if (act === "delb") { if (!confirm("Удалить этот блок?")) return; b.judging[+t.dataset.g].blocks.splice(+t.dataset.b, 1); }
    saveDraft(id, act === "addb" || act === "delb" ? "judging" : k); rerender();
  });
})();

/* ---------- маршрутизация ---------- */
function route() {
  if (LS.get("auth", "") !== CLUB_CODE_HASH) return gate();
  const h = (location.hash || "#/").slice(2).split("/");
  const [a, b, c] = h;
  if (!a) return home();
  if (a === "belt") return c ? section(b, c) : beltPage(b);
  if (a === "oath") return oath();
  if (a === "belts") return beltsPage();
  if (a === "tests") return testsPage();
  if (a === "test") return (b && /^\d+$/.test(b) && !c) ? testHub(b) : testRun(b, c);
  if (a === "cards") return cards(b);
  if (a === "more") return more();
  if (a === "editor") return editorPage();
  if (a === "edit") return editPage(b);
  home();
}
document.addEventListener("click", e => {
  
});
window.addEventListener("hashchange", route);

/* ---------- автообновление ---------- */
async function checkUpdate() {
  try {
    const r = await fetch("version.json?t=" + Date.now(), {cache:"no-store"}); const j = await r.json();
    return j.version === DATA.version ? "у вас последняя версия" : "доступна " + j.version + " — перезапустите приложение";
  } catch (e) { return "нет связи (работает офлайн)"; }
}
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("sw.js").then(reg => {
    reg.update && reg.update();
    let reloaded = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (reloaded || !navigator.serviceWorker.controller) return; reloaded = true; location.reload(); });
  }).catch(() => {});
}
loadContent().then(route, route);
</script></body></html>
